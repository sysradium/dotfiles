"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "catppuccin_mocha"
format = '$directory$character'
# Keep the right prompt predictable as Starship adds modules.
right_format = """
$username$hostname\
$kubernetes$aws$docker_context\
$vcs\
$nodejs$bun$deno$python$rust$c$cpp$lua$zig\
$conda$nix_shell$direnv\
$terraform$helm\
$cmd_duration$jobs$container\
"""
command_timeout = 500

# Available with `starship statusline claude-code`.
[profiles]
claude-code = '$claude_model$git_branch$claude_context$claude_cost'

[claude_model]
format = '[$symbol$model( $effort)]($style) '
style = "bold mauve"

[aws]
symbol = "  "
disabled = false

[gcloud]
disabled = true

[buf]
symbol = " "
disabled = true

[c]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
style = "bold teal"
repo_root_style = "bold lavender"
# Shorten the development prefix while marking omitted parent directories.
substitutions = [{ from = '^~/dev/', to = '…/', regex = true }]

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[N](bold base bg:green)"

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold mauve"
# Keep tracking information for non-default remotes.
ignore_remotes = ["origin"]

[git_status]
# Separate staged (green) and unstaged (yellow) changes without counting twice.
format = '([\[$conflicted$stashed$index_added$index_modified$index_deleted$index_typechanged$renamed$worktree_added$worktree_modified$worktree_deleted$worktree_typechanged$ahead_behind\]]($style) )'
conflicted = '=${count}'
stashed = '\$${count}'
index_added = '[+${count}](green)'
index_modified = '[~${count}](green)'
index_deleted = '[-${count}](green)'
index_typechanged = '[t${count}](green)'
renamed = '[»${count}](green)'
worktree_added = '[?${count}](yellow)'
worktree_modified = '[!${count}](yellow)'
worktree_deleted = '[-${count}](yellow)'
worktree_typechanged = '[t${count}](yellow)'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]
git_modules = '${custom.git_branch}$git_commit$git_state$git_metrics$git_status'

[custom.git_branch]
description = "Git branch, unless the directory already shows the matching worktree name"
require_repo = true
shell = ["sh"]
when = '''
branch=$(git symbolic-ref --quiet --short HEAD) || exit 0
root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
[ "$branch" = "${root##*/}" ] || exit 0

# Check Starship's actual directory output, including its truncation rules.
esc=$(printf '\033')
directory=$(starship module directory | sed -e "s/${esc}\[[0-9;]*m//g" -e 's/%{//g' -e 's/%}//g')
case "$directory" in
  "$branch "|*/"$branch "|"$branch/"*|*/"$branch/"*|"$branch 󰌾 "|*/"$branch 󰌾 ") exit 1 ;;
esac
exit 0
'''
command = 'starship module git_branch'
format = '$output '
# The output is already rendered and escaped by Starship's built-in module.
unsafe_no_escape = true

[jj_bookmark]
symbol = " "
style = "bold mauve"
ignore_remotes = ["origin"]

