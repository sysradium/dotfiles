[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold teal"
contexts = [
  { context_pattern = 'gke_[^_]+_[^_]+_(?P<cluster>.*prod.*)', style = "bold red", context_alias = '${cluster}' },
  { context_pattern = 'gke_[^_]+_[^_]+_(?P<cluster>.*dev.*)', style = "bold blue", context_alias = '${cluster}' },
  { context_pattern = 'gke_[^_]+_[^_]+_(?P<cluster>.*(?:stg|staging).*)', style = "bold green", context_alias = '${cluster}' },
  { context_pattern = 'gke_[^_]+_[^_]+_(?P<cluster>.*(?:ops|control).*)', style = "bold green", context_alias = '${cluster}' },
  { context_pattern = 'gke_[^_]+_[^_]+_(?P<cluster>.+)', context_alias = '${cluster}' },
  { context_pattern = ".*prod.*", style = "bold red" },
  { context_pattern = ".*dev.*", style = "bold blue" },
  { context_pattern = ".*(?:stg|staging).*", style = "bold green" },
  { context_pattern = ".*(?:ops|control).*", style = "bold green" },
]

