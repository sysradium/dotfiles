onboarding = false
[theme]
name = "catppuccin"

auto_switch = false
[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"

[keys]
prefix = "backtick"
detach = "prefix+d"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+."
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
copy_mode = "prefix+["
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
split_vertical = "prefix+|"
split_horizontal = "prefix+\""
close_pane = "prefix+x"
zoom = "prefix+z"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+q"
type = "popup"
command = '''
session=quick-shared
directory=$HOME
if [ -n "${HERDR_ACTIVE_WORKSPACE_ID:-}" ]; then
  # Workspace IDs are scoped to their parent Herdr server.
  server=${HERDR_SOCKET_PATH:-${HERDR_SESSION:-default}}
  digest=$(printf '%s\n%s' "$server" "$HERDR_ACTIVE_WORKSPACE_ID" | shasum -a 256) || exit
  session=$(printf 'quick-w-%.16s' "$digest")
  directory=${HERDR_ACTIVE_PANE_CWD:-$HOME}
fi
cd -P -- "$directory" 2>/dev/null || cd -- "$HOME" || exit
unset HERDR_ENV HERDR_SESSION HERDR_SOCKET_PATH HERDR_CLIENT_SOCKET_PATH HERDR_PANE_ID
exec env HERDR_CONFIG_PATH="$HOME/dotfiles/herdr/quick-terminal.toml" HERDR_STARTUP_CWD="$PWD" \
  "${HERDR_BIN_PATH:-herdr}" --session "$session"
'''
description = "Toggle quick terminal for this workspace"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+q"
type = "popup"
command = '''
cd -- "$HOME" || exit
unset HERDR_ENV HERDR_SESSION HERDR_SOCKET_PATH HERDR_CLIENT_SOCKET_PATH HERDR_PANE_ID
exec env HERDR_CONFIG_PATH="$HOME/dotfiles/herdr/quick-terminal.toml" HERDR_STARTUP_CWD="$PWD" \
  "${HERDR_BIN_PATH:-herdr}" --session quick-shared
'''
description = "Open shared quick terminal"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "tv sesh"
description = "open Sesh"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = '''
selected_url=$("${HERDR_BIN_PATH:-herdr}" pane read "$HERDR_ACTIVE_PANE_ID" --source visible --raw | rg -o 'https?://\S+' | sed 's/[";<>)]*$//' | sort -u | fzf) || exit 0
[ -n "$selected_url" ] && open "$selected_url"
'''
description = "Open URL from the active pane"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = 'exec python3 "$HOME/dotfiles/herdr/dashboard.py"'
description = "Live Codex / Claude terminal dashboard"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "sysradium.fm-tab-titles.name-tab"
description = "Regenerate the agent tab title with fm"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "top"
prompt_new_tab_name = false
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false

status_indicators = "symbols"

agent_panel_sort = "priority"
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false
