[theme]
name = "catppuccin"

auto_switch = false
[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"

[keys]
prefix = "backtick"
detach = "prefix+d"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+."
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
copy_mode = "prefix+["
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
split_vertical = "prefix+|"
split_horizontal = "prefix+\""
close_pane = "prefix+x"
zoom = "prefix+z"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "tv sesh"
description = "open Sesh"
width = "80%"
height = "70%"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "top"
prompt_new_tab_name = false
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
